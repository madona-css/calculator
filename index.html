<body>

        <div class="container">
            <div class="row justify-content-center align-items-center ">
                <div class=" col-12 col-md-6 col-lg-6 calcBody flex-column rounded-1">

                    <p>Enter the bill amount and tip percentage to calculate the total.
                    </p>
                    <label for="billInput">Bill amount :</label>
                    <input id="billInput" type="number">
                    <label for="tipInput">Tip amount :</label>
                    <input id="tipInput" type="number">
                    <button class="calcOutput">Calculate</button>
             <span class="tota"><b>Total:</b></span>       
<span id="total"></span>
                </div>
            </div>
        </div>
